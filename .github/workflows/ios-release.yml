name: iOS release (signed build → TestFlight)

# Manual only: secrets never reach pull requests or forks (public repo).
on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'Version shown in the App Store (CFBundleShortVersionString)'
        required: true
        default: '1.0.0'

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.axieduel.app
      PROFILE_NAME: Axie Duel App Store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Select the newest Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$X/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using $X"
      - name: Check the iOS SDK (App Store requires 26+)
        run: |
          xcodebuild -version
          v=$(xcrun --sdk iphoneos --show-sdk-version); echo "iOS SDK $v"
          [ "${v%%.*}" -ge 26 ] || { echo "Need the iOS 26 SDK"; exit 1; }

      - run: npm ci --ignore-scripts
      - name: Generate ios/ with release signing settings
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/gen-ios.sh

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/spm
          key: spm-x26-${{ hashFiles('package-lock.json') }}

      - name: Install the certificate, the profile and the API key (temporary keychain)
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/axd-signing.keychain-db"
          KC_PW=$(openssl rand -base64 24)
          echo "::add-mask::$KC_PW"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KC" | sed -E 's/[0-9A-F]{40}/<hash>/'
          # Xcode 16+ reads profiles from UserData; older tools from MobileDevice. Install in both.
          for d in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$d"
            echo "$PROFILE_BASE64" | base64 --decode > "$d/axie-duel-appstore.mobileprovision"
          done
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Archive (Release, signed)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            -clonedSourcePackagesDirPath ~/spm \
            MARKETING_VERSION='${{ inputs.marketing_version }}' CURRENT_PROJECT_VERSION='${{ github.run_number }}' \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            archive > build/archive.log 2>&1 || { tail -120 build/archive.log; exit 1; }
          tail -5 build/archive.log
          /usr/libexec/PlistBuddy -c 'Print :ApplicationProperties' build/App.xcarchive/Info.plist

      - name: Export and upload to App Store Connect (TestFlight)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > build/export.log 2>&1 || { tail -120 build/export.log; exit 1; }
          tail -20 build/export.log

      - name: Clean up signing material
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$HOME/.appstoreconnect/private_keys" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/axie-duel-appstore.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/axie-duel-appstore.mobileprovision"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-release-${{ github.run_number }}-logs
          path: build/*.log
          retention-days: 14
          if-no-files-found: warn
